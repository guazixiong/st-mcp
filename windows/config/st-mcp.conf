# ST-MCP Windows 配置
# 规则：每行第一条 '=' 左边是变量名，右边原样作为值（口令里的 = # 空格都保留）。
# 改完保存即可，不需要安装或联网。

# ---------- 动态连接（本版本核心能力） ----------
# 客户端在请求头或 URL 里携带目标库信息，一个 ST-MCP 进程可连任意多台神通库。
# 白名单：逗号分隔的 IP、CIDR（如 10.0.0.0/24）或 *.域名；* 表示全部放行。
# 默认只允许连本机的库；要连内网其它服务器，把它的 IP 加进来。
ST_DYNAMIC_ENABLED=yes
ST_DYNAMIC_ALLOW=127.0.0.1
ST_DYNAMIC_ALLOW_PORTS=2003
ST_DYNAMIC_DEFAULT_PORT=2003
ST_DYNAMIC_DEFAULT_DB=OSRDB
ST_DYNAMIC_ACCESS_MODE=unrestricted
# no = 请求必须带目标；yes = 不带目标时回落到下面的默认库
ST_DYNAMIC_ALLOW_DEFAULT=no
ST_MAX_TARGETS=16

# ---------- 本机 MCP 服务 ----------
SSE_HOST=0.0.0.0
SSE_PORT=8100
MCP_PATH=/mcp
LOG_LEVEL=INFO

# ---------- 默认库（仅当 ST_DYNAMIC_ALLOW_DEFAULT=yes 时使用） ----------
ST_HOST=127.0.0.1
ST_PORT=2003
ST_USER=SYSDBA
ST_PASSWORD=
ST_DB=OSRDB

# ---------- 神通客户端 ----------
# ACI.dll 所在目录；留空则自动探测 C:\ShentongDB\bin 等常见位置。
ST_BIN_DIR=
